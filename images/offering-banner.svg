<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Offering God Can Accept</title>
  <desc id="desc">A warm devotional banner for The Offering God Can Accept by Bradley Hobbs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211c17"/>
      <stop offset="52%" stop-color="#5c4730"/>
      <stop offset="100%" stop-color="#171411"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d7b477" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#9d7740" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="400" r="390" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 700 C260 610 430 690 650 640 C910 580 1120 700 1600 570 L1600 900 L0 900 Z" fill="#100e0c" opacity=".48"/>
  <path d="M0 0 L1600 0 L1600 120 C1280 180 1050 130 800 170 C530 210 300 150 0 230 Z" fill="#000" opacity=".18"/>
  <text x="800" y="390" text-anchor="middle" fill="#f8f0df" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="600">The Offering</text>
  <text x="800" y="485" text-anchor="middle" fill="#f8f0df" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="600">God Can Accept</text>
  <line x1="650" y1="545" x2="950" y2="545" stroke="#c39a5b" stroke-width="3"/>
  <text x="800" y="595" text-anchor="middle" fill="#dfcfb3" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5">BRADLEY HOBBS</text>
</svg>